<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple blog | login</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <form class="login-form" id="login-form">
        <h2>Login here</h2>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        
        <button type="submit">Login</button>

        <p class="log-p" id="register-link">Don't have an account? <a href="register.html">register</a></p>
    </form>
    <script type="module" src="js/login.js"></script>
</body>
</html>

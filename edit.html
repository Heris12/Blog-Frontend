<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>
    <link rel="stylesheet" href="style/style.css">   
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand">Simple Blog</a>

            <button class="nav-menu-toggle" id="nav-menu-toggle" type="button"
                    aria-controls="nav-link" aria-expanded="false" aria-label="Open navigation menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-link" id="nav-link">
                <ul>
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div class="form-card">
            <h2>Edit Blog Post</h2>
            <form id="edit-form">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" placeholder="enter title" required>
                </div>
                <div class="form-group">
                    <label for="body">Content:</label>
                    <textarea id="body" name="body" rows="5" placeholder="enter content" required></textarea>
                </div>
                <button type="submit">Edit Post</button>
            </form>
        </div>
    </main>

     <script type="module" src="js/edit.js"></script>
     <script type="module" src="js/nav.js"></script>
</body>
</html>
